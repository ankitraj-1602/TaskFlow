name: CI

# ─────────────────────────────────────────────────────────────
# WHEN this workflow runs
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [JestTesting, main]
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────
# WHAT runs
# ─────────────────────────────────────────────────────────────
jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    # ─── Service containers (Postgres + Redis) ─────────────
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        # Wait for Postgres to be ready before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ─── Environment variables for the whole job ───────────
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: taskflow_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CLIENT_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      BCRYPT_SALT_ROUNDS: 4
      CACHE_TTL_SECONDS: 300
      EMAIL_FROM_EMAIL: test@example.com
      EMAIL_FROM_NAME: TaskFlow
      BREVO_API_KEY: ci-placeholder-key
      EMAIL_VERIFICATION_EXPIRY_HOURS: 24
      PASSWORD_RESET_EXPIRY_HOURS: 1
      UPLOAD_DIR: ./uploads-test
      LOG_LEVEL: error

    # ─── Steps ─────────────────────────────────────────────
    steps:
      # 1. Get the code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # 4. Run database migrations against the test DB
      - name: Run database migrations
        working-directory: ./backend
        run: node src/db/migrate.js

      # 5. Lint (if you have ESLint configured)
      - name: Run linter
        working-directory: ./backend
        run: npm run lint --if-present

      # 6. Run all Jest tests
      - name: Run tests
        working-directory: ./backend
        run: npm test

      # 7. Run tests with coverage (optional second pass)
      - name: Run coverage
        working-directory: ./backend
        run: npm run test:coverage --if-present

      # 8. Upload coverage report as a downloadable artifact
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7