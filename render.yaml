services:
  - type: web
    name: taskflow-backend
    env: docker
    plan: free
    region: singapore  # closest to India; or oregon/frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false   # set in dashboard
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "TaskFlow <noreply@taskflow.dev>"
      - key: EMAIL_VERIFICATION_EXPIRY_HOURS
        value: 24
      - key: PASSWORD_RESET_EXPIRY_HOURS
        value: 1
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: UPLOAD_DIR
        value: /app/uploads